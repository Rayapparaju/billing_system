{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Billing System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .register-container { width: 100%; max-width: 440px; }
    .register-card {
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 40px;
    }
    .register-card .logo { text-align: center; margin-bottom: 30px; }
    .register-card .logo i { font-size: 2.5rem; color: #a5b4fc; margin-bottom: 10px; }
    .register-card .logo h2 { color: #fff; font-size: 1.5rem; font-weight: 700; }
    .register-card .logo p { color: rgba(255,255,255,.4); font-size: 0.85rem; margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; color: rgba(255,255,255,.7); font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; }
    .form-group .input-wrap {
      display: flex; align-items: center;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px; padding: 0 14px; transition: all 0.2s;
    }
    .form-group .input-wrap:focus-within { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
    .form-group .input-wrap i { color: rgba(255,255,255,.3); font-size: 1rem; }
    .form-group .input-wrap input {
      width: 100%; padding: 12px 14px; background: none; border: none;
      color: #fff; font-size: 0.9rem; font-family: inherit; outline: none;
    }
    .form-group .input-wrap input::placeholder { color: rgba(255,255,255,.3); }
    .btn-register {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: all 0.3s; font-family: inherit;
    }
    .btn-register:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,.4); }
    .auth-footer { text-align: center; margin-top: 20px; }
    .auth-footer a { color: rgba(255,255,255,.5); font-size: 0.85rem; text-decoration: none; transition: color 0.2s; }
    .auth-footer a:hover { color: #a5b4fc; }
    .alert {
      padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 0.85rem;
      display: flex; align-items: center; gap: 8px;
    }
    .alert-error { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    .alert-success { background: rgba(16,185,129,.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <div class="logo">
        <i class="fas fa-calculator"></i>
        <h2>BillingSys</h2>
        <p>Create your account</p>
      </div>
      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}"><i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %}"></i> {{ message }}</div>
        {% endfor %}
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap"><i class="fas fa-user"></i><input type="text" name="username" placeholder="Choose a username" required></div>
        </div>
        <div class="form-group">
          <label>Email (optional)</label>
          <div class="input-wrap"><i class="fas fa-envelope"></i><input type="email" name="email" placeholder="Enter email"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap"><i class="fas fa-lock"></i><input type="password" name="password" placeholder="Create password" required></div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrap"><i class="fas fa-lock"></i><input type="password" name="confirm" placeholder="Confirm password" required></div>
        </div>
        <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> Create Account</button>
      </form>
      <div class="auth-footer">
        <a href="{% url 'accounts:login' %}"><i class="fas fa-sign-in-alt"></i> Already have an account? Sign in</a>
      </div>
      <div class="auth-footer" style="margin-top:8px;">
        <a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>
</body>
</html>
