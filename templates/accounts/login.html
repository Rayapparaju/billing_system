{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Billing System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    .login-card {
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 40px;
    }
    .login-card .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-card .logo i {
      font-size: 2.5rem;
      color: #a5b4fc;
      margin-bottom: 10px;
    }
    .login-card .logo h2 {
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .login-card .logo p {
      color: rgba(255,255,255,.4);
      font-size: 0.85rem;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      color: rgba(255,255,255,.7);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .form-group .input-wrap {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 0 14px;
      transition: all 0.2s;
    }
    .form-group .input-wrap:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    .form-group .input-wrap i {
      color: rgba(255,255,255,.3);
      font-size: 1rem;
    }
    .form-group .input-wrap input {
      width: 100%;
      padding: 12px 14px;
      background: none;
      border: none;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    .form-group .input-wrap input::placeholder {
      color: rgba(255,255,255,.3);
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99,102,241,.4);
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
    }
    .login-footer a {
      color: rgba(255,255,255,.5);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .login-footer a:hover { color: #a5b4fc; }
    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    .alert-success { background: rgba(16,185,129,.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <i class="fas fa-calculator"></i>
        <h2>BillingSys</h2>
        <p>Sign in to your account</p>
      </div>
      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
          <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %}"></i>
          {{ message }}
        </div>
        {% endfor %}
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" name="username" placeholder="Enter username" required>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Enter password" required>
          </div>
        </div>
        <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      </form>
      <div class="login-footer">
        <a href="{% url 'accounts:register' %}"><i class="fas fa-user-plus"></i> Create Account</a>
      </div>
      <div class="login-footer" style="margin-top:8px;">
        <a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>
</body>
</html>
