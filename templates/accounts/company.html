{% extends 'base.html' %}
{% block title %}Company Settings - Billing System{% endblock %}
{% block page_title %}Company Settings{% endblock %}
{% block content %}
<div class="card fade-in" style="max-width:700px;">
  <div class="card-header"><h5><i class="fas fa-building" style="color:var(--primary);"></i> {{ company.name }}</h5></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" name="name" class="form-control" value="{{ company.name }}" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ company.phone|default:'' }}">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" value="{{ company.email|default:'' }}">
        </div>
        <div class="form-group">
          <label>GST Number</label>
          <input type="text" name="gst_number" class="form-control" value="{{ company.gst_number|default:'' }}">
        </div>
        <div class="form-group">
          <label>Website</label>
          <input type="url" name="website" class="form-control" value="{{ company.website|default:'' }}">
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" class="form-control" rows="3">{{ company.address|default:'' }}</textarea>
      </div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
