{% extends 'base.html' %}
{% block title %}Delete Product{% endblock %}
{% block page_title %}Delete Product{% endblock %}
{% block content %}
<div class="card fade-in" style="max-width:500px;margin:0 auto;">
  <div class="card-body" style="text-align:center;padding:40px;">
    <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:var(--danger);margin-bottom:15px;"></i>
    <h4 style="margin-bottom:10px;">Delete Product</h4>
    <p style="color:var(--gray-500);margin-bottom:25px;">Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <div style="display:flex;gap:10px;justify-content:center;">
        <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button>
        <a href="{% url 'products:list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
