{% extends 'base.html' %}
{% block title %}Categories - Billing System{% endblock %}
{% block page_title %}Categories{% endblock %}
{% block content %}
<div class="card fade-in" style="max-width:600px;">
  <div class="card-header">
    <h5><i class="fas fa-tags" style="color:var(--primary);"></i> Categories</h5>
    <a href="{% url 'products:category_add' %}" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Add Category</a>
  </div>
  <div class="card-body">
    <table class="table">
      <thead><tr><th>Name</th><th>Actions</th></tr></thead>
      <tbody>
        {% for c in categories %}
        <tr>
          <td>{{ c.name }}</td>
          <td>
            <button class="btn btn-danger btn-sm" data-delete-url="{% url 'products:category_delete' c.pk %}" data-item="{{ c.name }}"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
        {% empty %}<tr><td colspan="2" style="text-align:center;padding:30px;color:var(--gray-400);">No categories.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
