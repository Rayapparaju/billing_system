{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="card fade-in" style="max-width:600px;">
  <div class="card-header">
    <h5><i class="fab fa-whatsapp" style="color:#25D366;"></i> Send via WhatsApp</h5>
    <a href="{{ cancel_url }}" class="btn btn-outline btn-sm">Back</a>
  </div>
  <div class="card-body">
    <p style="margin-bottom:16px;">Sending to: <strong>{{ phone }}</strong></p>
    <div class="card" style="background:var(--gray-100);padding:16px;margin-bottom:20px;white-space:pre-wrap;font-family:monospace;font-size:0.85rem;">
{{ message }}
    </div>
    <form method="post">
      {% csrf_token %}
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-success"><i class="fab fa-whatsapp"></i> Send via WhatsApp</button>
        <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
